name: Build & Deploy SUDRA iOS to TestFlight / App Store

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'App to build & deploy'
        required: true
        type: choice
        options:
          - client_app
          - driver_app
          - both
        default: both
      build_number:
        description: 'Build Number (e.g. 1, 2, 3)'
        required: false
        default: '1'

jobs:
  build-and-release-ios:
    runs-on: macos-14
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(github.event.inputs.target_app == 'both' && '["client_app", "driver_app"]' || (github.event.inputs.target_app == 'driver_app' && '["driver_app"]' || '["client_app"]')) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & CocoaPods
        run: |
          flutter doctor -v
          pod --version

      - name: Install Dependencies
        working-directory: ${{ matrix.app }}
        run: |
          flutter pub get
          flutter test

      - name: Prepare App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Install Apple Certificates & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          PROVISION_PROFILE_CLIENT: ${{ secrets.APPLE_PROVISION_PROFILE_CLIENT_BASE64 }}
          PROVISION_PROFILE_DRIVER: ${{ secrets.APPLE_PROVISION_PROFILE_DRIVER_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_keychain_pass' }}
          CURRENT_APP: ${{ matrix.app }}
        run: |
          # 1. Create and unlock temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

          # 2. Decode and import Distribution Certificate via standard OpenSSL PEM
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            UNLOCKED_PEM=$RUNNER_TEMP/unlocked_signing.pem
            
            python3 -c "import os, base64; open('$CERTIFICATE_PATH', 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64']))"
            
            # Decrypt PKCS12 to PEM and import PEM to keychain cleanly
            openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin "pass:$P12_PASSWORD" -out "$UNLOCKED_PEM"
            security import "$UNLOCKED_PEM" -k "$KEYCHAIN_PATH" -A -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            # Clean up temp decrypted PEM
            rm -f "$UNLOCKED_PEM" "$CERTIFICATE_PATH"
            echo "Certificate & Private Key successfully imported into keychain."
          fi

          # 3. Decode and import Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ "$CURRENT_APP" = "client_app" ] && [ -n "$PROVISION_PROFILE_CLIENT" ]; then
            python3 -c "import os, base64; open(os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/client.mobileprovision'), 'wb').write(base64.b64decode(os.environ['PROVISION_PROFILE_CLIENT']))"
          elif [ "$CURRENT_APP" = "driver_app" ] && [ -n "$PROVISION_PROFILE_DRIVER" ]; then
            python3 -c "import os, base64; open(os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/driver.mobileprovision'), 'wb').write(base64.b64decode(os.environ['PROVISION_PROFILE_DRIVER']))"
          fi

          # 4. Set keychain in user search list
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Install CocoaPods
        working-directory: ${{ matrix.app }}/ios
        run: |
          pod install --repo-update

      - name: Build Release IPA
        working-directory: ${{ matrix.app }}
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUDRA-${{ matrix.app }}-Release-IPA
          path: ${{ matrix.app }}/build/ios/ipa/*.ipa

      - name: Upload to App Store Connect / TestFlight
        working-directory: ${{ matrix.app }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to App Store Connect..."
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
            echo "Upload to TestFlight completed successfully!"
          else
            echo "IPA file not found."
            exit 1
          fi
